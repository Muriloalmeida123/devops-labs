name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check .

  test:
    name: Test (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [lint, test]           # só roda se lint E test passarem
    if: github.event_name == 'push'   # não publica imagem em PR, só em push
    permissions:
      contents: read
      packages: write            # necessário para publicar no GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          OWNER=${{ github.repository_owner }}
          echo "IMAGE=ghcr.io/${OWNER,,}/devops-api" >> "$GITHUB_ENV"
          SHA=${{ github.sha }}
          echo "SHORT_SHA=${SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build -t $IMAGE:$SHORT_SHA -t $IMAGE:latest .

      - name: Push image
        run: |
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:latest

  update-manifest:
    name: Update Helm values (GitOps)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: write     # precisa gravar de volta no repositório

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        run: |
          SHA=${{ github.sha }}
          echo "SHORT_SHA=${SHA:0:7}" >> "$GITHUB_ENV"

      - name: Bump image tag in values.yaml
        run: |
          sed -i "s/^\(\s*tag:\s*\).*/\1${SHORT_SHA}/" helm/devops-api/values.yaml
          cat helm/devops-api/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/devops-api/values.yaml
          git diff --cached --quiet && echo "Nada mudou" && exit 0
          git commit -m "chore: bump image to ${SHORT_SHA} [skip ci]"
          git push