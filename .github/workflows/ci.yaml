name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check .

  test:
    name: Test (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [lint, test]           # só roda se lint E test passarem
    if: github.event_name == 'push'   # não publica imagem em PR, só em push
    permissions:
      contents: read
      packages: write            # necessário para publicar no GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          OWNER=${{ github.repository_owner }}
          echo "IMAGE=ghcr.io/${OWNER,,}/devops-api" >> "$GITHUB_ENV"
          SHA=${{ github.sha }}
          echo "SHORT_SHA=${SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build -t $IMAGE:$SHORT_SHA -t $IMAGE:latest .

      - name: Push image
        run: |
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:latest